            - paragraph [ref=f4e118]: "Científicos detectaron señales procedentes de la escala más pequeña de la naturaleza jamás explorada: 100 mil millones de veces menor que un átomo."
            - paragraph [ref=f4e120]: Un mundo tan pequeño que algunos físicos lo han apodado el zeptoverso.
            - paragraph [ref=f4e122]: La investigación, liderada por científicos basados en Cambridge, se obtuvo a partir de un experimento realizado en el Gran Colisionador de Hadrones (LHC).
            - paragraph [ref=f4e124]: Esta enorme máquina, ubicada en el Laboratorio Europeo de Física de Partículas (CERN), en la frontera suizo-francesa, cerca de Ginebra, hace colisionar átomos para separarlos y descubrir qué hay en su interior.
            - paragraph [ref=f4e126]: El hallazgo, que se produce tras más de 40 años de búsqueda, podría ayudar a los investigadores a explorar un mundo misterioso miles de millones de veces más pequeño que un átomo, y a desarrollar una teoría nueva y más completa sobre cómo funciona el universo.
            - region [aria-hidden] [ref=f4e127]
            - heading "\"Llamando a la puerta\" del zeptoverso" [level=2] [ref=f4e129]
            - paragraph [ref=f4e131]: La materia oscura constituye una gran parte de nuestro cosmos, y sin embargo, los investigadores han tenido dificultades para detectarla.
            - paragraph [ref=f4e133]: Los científicos saben que está ahí porque su fuerza gravitatoria influye en la materia ordinaria, pero en todos los demás aspectos ha permanecido completamente invisible.
            - paragraph [ref=f4e135]: "En este experimento se hicieron colisionar partículas a alta energía y los científicos estudiaron el material que se expulsó: los fragmentos resultantes de las colisiones."
            - region "Más leídas" [ref=f4e136]:

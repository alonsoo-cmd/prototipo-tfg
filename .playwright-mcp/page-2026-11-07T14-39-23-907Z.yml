            - heading "Qué es el \"zeptoverso\", el mundo más pequeño jamás detectado en la naturaleza, y por qué es clave para entender el universo" [level=1] [ref=f4e83]
            - figure "Pie de foto, Muchas partículas subatómicas se crean al chocar las partes internas de los átomos." [ref=f4e84]:

                - paragraph [ref=f4e177]: Final de Más leídas
            - paragraph [ref=f4e179]: Una de ellas es una partícula subatómica, más pequeña que un átomo, llamada quark fondo o quark inferior (o también quark "belleza").
            - paragraph [ref=f4e181]: La partícula es inestable y existe durante tan solo una billonésima y media de segundo antes de descomponerse en otras formas, es decir, desintegrarse.
            - paragraph [ref=f4e183]: A pesar de su corta vida útil, los investigadores lograron detectar su interacción con otras partículas diminutas a una escala de una billonésima de metro.
            - paragraph [ref=f4e185]: Algunas teorías sugieren que, a estas escalas, las partículas son más sensibles a la materia oscura, lo que podría influir en la interacción y la desintegración de los quarks.
            - paragraph [ref=f4e187]: Por lo tanto, detectar actividad en este diminuto universo podría ayudar a los científicos a detectar la materia oscura.
            - figure "Pie de foto, El Dr. Harry Cliff es uno de los científicos británicos que participan en la investigación." [ref=f4e188]:
              - generic [ref=f4e189]:
                - img "Harry Cliff escribiendo en una pizarra blanca. Viste una camisa azul marino oscuro y levanta el brazo derecho, sosteniendo un rotulador cerca del borde superior de la pizarra." [ref=f4e190]
                - paragraph [ref=f4e191]:
                  - generic [ref=f4e192]: Fuente de la imagen,
                  - text: Joshua Falcon/BBC
              - generic [ref=f4e194]:
                - generic [ref=f4e195]: Pie de foto,
                - text: El Dr. Harry Cliff es uno de los científicos británicos que participan en la investigación.
            - paragraph [ref=f4e197]: "\"Los físicos han estado buscando este tipo poco común de desintegración desde 1984, es decir, antes de que yo naciera\", comentó el Dr. Harry Cliff, de la Universidad de Cambridge, quien dirigió el análisis de los datos."
            - paragraph [ref=f4e199]: Según explicó, esta danza subatómica proporcionó a los investigadores una perspectiva privilegiada del comportamiento de posibles nuevas partículas.
            - paragraph [ref=f4e201]: "\"Estamos llamando a la puerta de este zeptoverso\", le dijo a BBC News."
            - paragraph [ref=f4e203]: "\"Lo que queremos hacer ahora es entrar, explorar y descubrir qué nuevas partículas nos esperan. Y para ello, necesitamos más datos\", añadió Cliff."
            - paragraph [ref=f4e205]: El profesor Brian Cox, reconocido divulgador científico e investigador de física de partículas en la Universidad de Manchester, que no forma parte del equipo de investigación, describió el resultado como "importante".
            - paragraph [ref=f4e207]: Los hallazgos, que aún no han sido sometidos a revisión por pares, se presentan este lunes en el CERN.
            - heading "Participación británica" [level=2] [ref=f4e209]

                    - paragraph [ref=f4e225]: Descárgala aquí
                - paragraph [ref=f4e230]: Fin de Anuncio app
            - paragraph [ref=f4e232]: Los 28 países que participan en el proyecto han acordado contribuir con US$200 millones para modernizar este detector en el Gran Colisionador de Hadrones (LHCb), lo que aumentaría la frecuencia de estas desintegraciones diez veces.
            - paragraph [ref=f4e234]: Los científicos esperan que nuevas mejoras en el equipamiento del colisionador, previstas para la década de 2030, les permitan examinar estos sucesos poco frecuentes con mucho mayor detalle.
            - paragraph [ref=f4e236]: "\"Con eso podemos indagar en el zeptoverso y ver qué nos espera\", dijo Cliff."
            - paragraph [ref=f4e238]: Sin embargo, el año pasado, la agencia UK Research and Innovation (UKRI), el organismo gubernamental encargado de la financiación de la investigación, anunció que retiraba su parte del dinero destinado a la mejora prevista.
            - paragraph [ref=f4e240]: Aunque esta investigación fue dirigida por científicos basados en Cambridge, debido a los recortes, el profesor Tim Gershon, quien conduce la colaboración internacional LHCb, declaró a BBC News que la plena participación de Reino Unido en la investigación estaría en duda.
            - paragraph [ref=f4e242]: "\"Reino Unido corre el riesgo de no participar y de no realizar descubrimientos realmente importantes\", declaró a BBC News."
            - paragraph [ref=f4e244]: "*Con información del corresponsal de Ciencia de BBC News Pallab Gosh y el reportero de Ciencia Josh Falcon."

        - region "Glosario" [ref=e361]:
          - generic [ref=e363]:
            - heading "Glosario" [level=2] [ref=e364]
            - paragraph [ref=e365]: Qué significa cada término que verás en la app
          - generic [ref=e366]:
            - generic [ref=e367]:
              - term [ref=e368]: TRIMP (TR)
              - definition [ref=e369]: "Carga del entrenamiento. Combina lo que ha durado la sesión y lo altas que han ido tus pulsaciones: cuanto más alto, más exigente. En las tarjetas aparece abreviado como TR."
            - generic [ref=e370]:
              - term [ref=e371]: WT · Bienestar total
              - definition [ref=e372]: "Suma de los cinco indicadores de bienestar del día (irritabilidad, fatiga, agujetas, mal descanso y estrés). Va de 5 a 50: cuanto más bajo, mejor estás."
            - generic [ref=e373]:
              - term [ref=e374]: RPE · Esfuerzo percibido
              - definition [ref=e375]: Lo duro que te ha parecido el entrenamiento, del 1 (muy suave) al 10 (esfuerzo máximo).
            - generic [ref=e376]:
              - term [ref=e377]: FC media
              - definition [ref=e378]: Pulsaciones medias durante el entrenamiento. Junto con la duración, sirve para calcular el TRIMP.
            - generic [ref=e379]:
              - term [ref=e380]: FC en reposo
              - definition [ref=e381]: Tus pulsaciones en reposo, mejor medidas al despertar. Si suben varios días seguidos, puede ser señal de cansancio o de que estás incubando algo.
            - generic [ref=e382]:
              - term [ref=e383]: HRV · Variabilidad cardiaca
              - definition [ref=e384]: Pequeñas variaciones de tiempo entre latidos, en milisegundos. Suele medirla el reloj por la noche. Si baja mucho respecto a lo habitual, puede indicar cansancio.
            - generic [ref=e385]:
              - term [ref=e386]: Ritmo (min/km)
              - definition [ref=e387]: Minutos que tardas en recorrer un kilómetro. Cuanto más bajo, más rápido vas.
            - generic [ref=e388]:
              - term [ref=e389]: Umbrales LT1 y LT2
              - definition [ref=e390]: "Marcan las zonas de intensidad. Hasta LT1: ritmo cómodo, puedes hablar. Entre LT1 y LT2: exigente pero sostenible. Por encima de LT2: muy intenso, solo se aguanta poco tiempo."
            - generic [ref=e391]:
              - term [ref=e392]: Fases (BI, BII, BIII)
              - definition [ref=e393]: "La preparación se divide en bloques: BI Base (volumen suave), BII Acumulación y Transformación (más carga y calidad), BIII Realización (afinar para la carrera) y Competición."
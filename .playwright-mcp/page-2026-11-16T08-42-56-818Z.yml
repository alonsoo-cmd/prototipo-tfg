          - generic [ref=f2e177]:
            - heading "Glosario" [level=2] [ref=f2e178]
            - paragraph [ref=f2e179]: Qué significa cada término que verás en la app
          - generic [ref=f2e180]:
            - generic [ref=f2e181]:
              - term [ref=f2e182]: TRIMP (TR)
              - definition [ref=f2e183]: "Carga del entrenamiento. Combina lo que ha durado la sesión y lo altas que han ido tus pulsaciones: cuanto más alto, más exigente. En las tarjetas aparece abreviado como TR."
            - generic [ref=f2e184]:
              - term [ref=f2e185]: WT · Bienestar total
              - definition [ref=f2e186]: "Suma de los cinco indicadores de bienestar del día (irritabilidad, fatiga, agujetas, mal descanso y estrés). Va de 5 a 50: cuanto más bajo, mejor estás."
            - generic [ref=f2e187]:
              - term [ref=f2e188]: RPE · Esfuerzo percibido
              - definition [ref=f2e189]: Lo duro que te ha parecido el entrenamiento, del 1 (muy suave) al 10 (esfuerzo máximo).
            - generic [ref=f2e190]:
              - term [ref=f2e191]: FC media
              - definition [ref=f2e192]: Pulsaciones medias durante el entrenamiento. Junto con la duración, sirve para calcular el TRIMP.
            - generic [ref=f2e193]:
              - term [ref=f2e194]: FC en reposo
              - definition [ref=f2e195]: Tus pulsaciones en reposo, mejor medidas al despertar. Si suben varios días seguidos, puede ser señal de cansancio o de que estás incubando algo.
            - generic [ref=f2e196]:
              - term [ref=f2e197]: HRV · Variabilidad cardiaca
              - definition [ref=f2e198]: Pequeñas variaciones de tiempo entre latidos, en milisegundos. Suele medirla el reloj por la noche. Si baja mucho respecto a lo habitual, puede indicar cansancio.
            - generic [ref=f2e199]:
              - term [ref=f2e200]: Ritmo (min/km)
              - definition [ref=f2e201]: Minutos que tardas en recorrer un kilómetro. Cuanto más bajo, más rápido vas.
            - generic [ref=f2e202]:
              - term [ref=f2e203]: Umbrales LT1 y LT2
              - definition [ref=f2e204]: "Marcan las zonas de intensidad. Hasta LT1: ritmo cómodo, puedes hablar. Entre LT1 y LT2: exigente pero sostenible. Por encima de LT2: muy intenso, solo se aguanta poco tiempo."
            - generic [ref=f2e205]:
              - term [ref=f2e206]: Fases (BI, BII, BIII)
              - definition [ref=f2e207]: "La preparación se divide en bloques: BI Base (volumen suave), BII Acumulación y Transformación (más carga y calidad), BIII Realización (afinar para la carrera) y Competición."
        - region "Glosario" [ref=f10e451]:
          - generic [ref=f10e453]:
            - heading "Glosario" [level=2] [ref=f10e454]
            - paragraph [ref=f10e455]: Qué significa cada término que verás en la app
          - generic [ref=f10e456]:
            - generic [ref=f10e457]:
              - term [ref=f10e458]: TRIMP (TR)
              - definition [ref=f10e459]: "Carga del entrenamiento. Combina lo que ha durado la sesión y lo altas que han ido tus pulsaciones: cuanto más alto, más exigente. En las tarjetas aparece abreviado como TR."
            - generic [ref=f10e460]:
              - term [ref=f10e461]: WT · Bienestar total
              - definition [ref=f10e462]: "Suma de los cinco indicadores de bienestar del día (irritabilidad, fatiga, agujetas, mal descanso y estrés). Va de 5 a 50: cuanto más bajo, mejor estás."
            - generic [ref=f10e463]:
              - term [ref=f10e464]: RPE · Esfuerzo percibido
              - definition [ref=f10e465]: Lo duro que te ha parecido el entrenamiento, del 1 (muy suave) al 10 (esfuerzo máximo).
            - generic [ref=f10e466]:
              - term [ref=f10e467]: FC media
              - definition [ref=f10e468]: Pulsaciones medias durante el entrenamiento. Junto con la duración, sirve para calcular el TRIMP.
            - generic [ref=f10e469]:
              - term [ref=f10e470]: FC en reposo
              - definition [ref=f10e471]: Tus pulsaciones en reposo, mejor medidas al despertar. Si suben varios días seguidos, puede ser señal de cansancio o de que estás incubando algo.
            - generic [ref=f10e472]:
              - term [ref=f10e473]: HRV · Variabilidad cardiaca
              - definition [ref=f10e474]: Pequeñas variaciones de tiempo entre latidos, en milisegundos. Suele medirla el reloj por la noche. Si baja mucho respecto a lo habitual, puede indicar cansancio.
            - generic [ref=f10e475]:
              - term [ref=f10e476]: Ritmo (min/km)
              - definition [ref=f10e477]: Minutos que tardas en recorrer un kilómetro. Cuanto más bajo, más rápido vas.
            - generic [ref=f10e478]:
              - term [ref=f10e479]: Umbrales LT1 y LT2
              - definition [ref=f10e480]: "Marcan las zonas de intensidad. Hasta LT1: ritmo cómodo, puedes hablar. Entre LT1 y LT2: exigente pero sostenible. Por encima de LT2: muy intenso, solo se aguanta poco tiempo."
            - generic [ref=f10e481]:
              - term [ref=f10e482]: Fases (BI, BII, BIII)
              - definition [ref=f10e483]: "La preparación se divide en bloques: BI Base (volumen suave), BII Acumulación y Transformación (más carga y calidad), BIII Realización (afinar para la carrera) y Competición."
        - region "Glosario" [ref=e376]:
          - generic [ref=e378]:
            - heading "Glosario" [level=2] [ref=e379]
            - paragraph [ref=e380]: Qué significa cada término que verás en la app
          - generic [ref=e381]:
            - generic [ref=e382]:
              - term [ref=e383]: TRIMP (TR)
              - definition [ref=e384]: "Carga del entrenamiento. Combina lo que ha durado la sesión y lo altas que han ido tus pulsaciones: cuanto más alto, más exigente. En las tarjetas aparece abreviado como TR."
            - generic [ref=e385]:
              - term [ref=e386]: WT · Bienestar total
              - definition [ref=e387]: "Suma de los cinco indicadores de bienestar del día (irritabilidad, fatiga, agujetas, mal descanso y estrés). Va de 5 a 50: cuanto más bajo, mejor estás."
            - generic [ref=e388]:
              - term [ref=e389]: RPE · Esfuerzo percibido
              - definition [ref=e390]: Lo duro que te ha parecido el entrenamiento, del 1 (muy suave) al 10 (esfuerzo máximo).
            - generic [ref=e391]:
              - term [ref=e392]: FC media
              - definition [ref=e393]: Pulsaciones medias durante el entrenamiento. Junto con la duración, sirve para calcular el TRIMP.
            - generic [ref=e394]:
              - term [ref=e395]: FC en reposo
              - definition [ref=e396]: Tus pulsaciones en reposo, mejor medidas al despertar. Si suben varios días seguidos, puede ser señal de cansancio o de que estás incubando algo.
            - generic [ref=e397]:
              - term [ref=e398]: HRV · Variabilidad cardiaca
              - definition [ref=e399]: Pequeñas variaciones de tiempo entre latidos, en milisegundos. Suele medirla el reloj por la noche. Si baja mucho respecto a lo habitual, puede indicar cansancio.
            - generic [ref=e400]:
              - term [ref=e401]: Ritmo (min/km)
              - definition [ref=e402]: Minutos que tardas en recorrer un kilómetro. Cuanto más bajo, más rápido vas.
            - generic [ref=e403]:
              - term [ref=e404]: Umbrales LT1 y LT2
              - definition [ref=e405]: "Marcan las zonas de intensidad. Hasta LT1: ritmo cómodo, puedes hablar. Entre LT1 y LT2: exigente pero sostenible. Por encima de LT2: muy intenso, solo se aguanta poco tiempo."
            - generic [ref=e406]:
              - term [ref=e407]: Fases (BI, BII, BIII)
              - definition [ref=e408]: "La preparación se divide en bloques: BI Base (volumen suave), BII Acumulación y Transformación (más carga y calidad), BIII Realización (afinar para la carrera) y Competición."